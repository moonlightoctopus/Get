<!DOCTYPE html>
<html>

<body>

<div id="posts"></div>

<script>

const url =
"https://script.google.com/macros/s/AKfycbyLKqDq04V4Ytov5jEQvzwXHq5I5qXCZryjFbn4htopjRueXIZandfcc_y3jWYJ-7f4/exec";

fetch(url)
.then(r => r.json())
.then(posts => {

    const container = document.getElementById("posts");

    posts.reverse();

    posts.forEach(post => {

        container.innerHTML += `
            <div class="post">
                <h2>${post.title}</h2>
                <h4>${post.body}</h4>
                <p>${post.tags}</p>
            </div>
        `;

    });

});

</script>

</body>
</html>
