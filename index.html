<!DOCTYPE html>
<html>

<head>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 40px;
}


#posts {
    max-width: 900px;
    margin: auto;
}


.post {

    background: white;
    border-radius: 20px;
    padding: 35px;
    margin-bottom: 40px;

    text-align: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);
}


.account {

    display: inline-block;

    background: #333;
    color: white;

    padding: 12px 30px;

    border-radius: 999px;

    font-size: 24px;
    font-weight: bold;

    margin-bottom: 25px;
}

.title {

    font-size: 42px;
    font-weight: bold;

    margin-bottom: 20px;

}

.body {

    font-size: 24px;

    line-height: 1.6;

    margin-bottom: 30px;

    white-space: pre-wrap;

}

.tags {

    margin-top: 20px;

}


.tag {

    display: inline-block;

    background: #e8e8e8;

    color: #444;

    padding: 10px 18px;

    margin: 5px;

    border-radius: 999px;

    font-size: 18px;

}



</style>

</head>


<body>


<div id="posts"></div>


<script>


const url = "https://script.google.com/macros/s/AKfycbwSqSCwT67xJAhBB3z91nuqm0ZxS9Z_wdu_Lwsw1w05Qr365qjKGfV1hED1nJmqGrYB7A/exec";


fetch(url)

.then(response => response.json())

.then(posts => {


    const container =
        document.getElementById("posts");


    posts.reverse();


    posts.forEach(post => {


        const tags = post.tags

            .split(",")

            .map(tag =>
                `<span class="tag">
                    ${tag.trim()}
                 </span>`
            )

            .join("");



        container.innerHTML += `


        <div class="post">
        
            <div class="header">
        
                <div class="account">
                    ${post.name}
                </div>
        
                <div class="time">
                    ${new Date(post.timestamp).toLocaleString()}
                </div>
        
            </div>
        
            <div class="title">
                ${post.title}
            </div>
        
            <div class="body">
                ${post.body}
            </div>
        
            <div class="tags">
                ${tags}
            </div>
        
        </div>


        `;


    });


});


</script>


</body>

</html>
