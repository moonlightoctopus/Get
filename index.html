<!DOCTYPE html>
<html>

<head>

<style>

.top-button {
    position: fixed;
    top: 15px;

    background: #1a73e8;
    color: white;

    padding: 12px 20px;

    border-radius: 999px;

    font-size: 18px;
    font-weight: bold;

    text-decoration: none;

    box-shadow: 0 3px 10px rgba(0,0,0,0.2);

    z-index: 1000;
}

.top-button:hover {
    background: #1558b0;
}

#submit {
    left: 15px;
}

#account {
    right: 15px;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 40px;
}


#posts {
    max-width: 900px;
    margin: auto;
}


.post {

    background: white;
    border-radius: 20px;
    padding: 35px;
    margin-bottom: 40px;

    text-align: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);
}


.account {
    display: inline;
    background: none;
    color: #1a73e8;

    padding: 0;
    border-radius: 0;

    font-size: 20px;
    font-weight: bold;

    text-decoration: none;
}

.account:hover {
    text-decoration: underline;
}

.title {

    font-size: 42px;
    font-weight: bold;

    margin-bottom: 20px;

}

.body {

    font-size: 24px;

    line-height: 1.6;

    margin-bottom: 30px;

    white-space: pre-wrap;

}

.tags {

    margin-top: 20px;

}


.tag {

    display: inline-block;

    background: #e8e8e8;

    color: #444;

    padding: 10px 18px;

    margin: 5px;

    border-radius: 999px;

    font-size: 18px;

}



</style>

</head>


<body>
    
<a
    id="submit"
    class="top-button"
    href="https://forms.gle/CMp8R9QD4FQjnYh3A"
>
    Submit a post
</a>

<a
    id="account"
    class="top-button"
    href="https://forms.gle/vFY3431M2UkGoQky5"
>
    Make an account
</a>

<div id="posts"></div>


<script>

function accountUrl(name) {
    return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-");
}
const url = "https://script.google.com/macros/s/AKfycbzdNDU1RbG2WpfqK2wCEPSv6x-JeLEP4JKDt2Im-Lu_wJQbXDRWfC71O1PIXSqNF-21SA/exec";


fetch(url)

.then(response => response.json())

.then(posts => {


    const container =
        document.getElementById("posts");


    posts.reverse();


    posts.forEach(post => {


        const tags = post.tags

            .split(",")

            .map(tag =>
                `<span class="tag">
                    ${tag.trim()}
                 </span>`
            )

            .join("");



        container.innerHTML += `


        <div class="post">
        
            <div class="header">
        
                <a
                    class="account"
                    href="https://moonlightoctopu.github.io/Get/accounts/${accountUrl(post.name)}.html"
                >
                    ${post.name}
                </a>
                        
                <div class="time">
                    ${new Date(post.timestamp).toLocaleString()}
                </div>
        
            </div>
        
            <div class="title">
                ${post.title}
            </div>
        
            <div class="body">${
                post.body.trim()
            }</div>
        
            <div class="tags">
                ${tags}
            </div>
        
        </div>


        `;


    });


});


</script>


</body>

</html>
