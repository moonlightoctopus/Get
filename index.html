<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Get - Bulletin Board</title>

<style>

@font-face {
    font-family: 'Win95';
    src: local('MS Sans Serif'), local('Tahoma');
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'MS Sans Serif', 'Tahoma', Geneva, sans-serif;
    font-size: 13px;
    background: #c0c0c0;
    margin: 0;
    padding: 0;
    color: #000;
}

/* ---------- top taskbar ---------- */

.taskbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    background: #c0c0c0;
    border-bottom: 2px solid #000;
    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    z-index: 1000;
}

.win95-btn {
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
}

.win95-btn:active {
    border-style: inset;
    padding: 9px 15px 7px 17px;
}

/* ---------- posts area ---------- */

#posts {
    max-width: 700px;
    margin: 0 auto;
    padding: 74px 20px 40px 20px;
}

.post {
    background: #c0c0c0;
    border: 2px outset #fff;
    margin-bottom: 24px;
}

.post-body-wrap {
    background: #c0c0c0;
    padding: 12px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 2px inset #808080;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 12px;
}

.account {
    background: none;
    color: #000;
    font-weight: bold;
    text-decoration: none;
    font-size: 13px;
}

.account:hover {
    text-decoration: underline;
}

.time {
    color: #000;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #000;
}

.body {
    background: #fff;
    border: 2px inset #808080;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    white-space: pre-wrap;
}

.tags {
    margin-top: 4px;
}

.tag {
    display: inline-block;
    background: #c0c0c0;
    border: 2px outset #fff;
    color: #000;
    padding: 4px 10px;
    margin: 3px 4px 3px 0;
    font-size: 12px;
}

</style>

</head>


<body>

<div class="taskbar">
    <a id="submit" class="win95-btn" href="https://forms.gle/CMp8R9QD4FQjnYh3A">
        Submit a post
    </a>

    <a id="account" class="win95-btn" href="https://forms.gle/vFY3431M2UkGoQky5">
        Make an account
    </a>
</div>

<div id="posts"></div>


<script>

function accountUrl(name) {
    return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-");
}
const url = "https://script.google.com/macros/s/AKfycbzUdHtOTiTLZZrCj5ja3NcqAecDbMq5cnHXaKXCP-nQG5pneT2_6diIDleZvMppKVcReQ/exec";


fetch(url)

.then(response => response.json())

.then(posts => {


    const container =
        document.getElementById("posts");


    posts.reverse();


    posts.forEach(post => {


        const tags = post.tags

            .split(",")

            .map(tag =>
                `<span class="tag">
                    ${tag.trim()}
                 </span>`
            )

            .join("");



        container.innerHTML += `


        <div class="post">

            <div class="post-body-wrap">

                <div class="header">

                    <a
                        class="account"
                        href="https://moonlightoctopus.github.io/Get/accounts/${accountUrl(post.name)}.html"
                    >
                        ${post.name}
                    </a>

                    <div class="time">
                        ${new Date(post.timestamp).toLocaleString()}
                    </div>

                </div>

                <div class="title">${post.title}</div>

                <div class="body">${
                    post.body.trim()
                }</div>

                <div class="tags">
                    ${tags}
                </div>

            </div>

        </div>


        `;


    });


});


</script>


</body>

</html>
