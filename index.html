<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Get - Bulletin Board</title>

<style>

@font-face {
    font-family: 'Win95';
    src: local('MS Sans Serif'), local('Tahoma');
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'MS Sans Serif', 'Tahoma', Geneva, sans-serif;
    font-size: 13px;
    background: #c0c0c0;
    margin: 0;
    padding: 0;
    color: #000;
}

/* ---------- top taskbar ---------- */

.taskbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    background: #c0c0c0;
    border-bottom: 2px solid #000;
    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    z-index: 1000;
}

.win95-btn {
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
}

.win95-btn:active {
    border-style: inset;
    padding: 9px 15px 7px 17px;
}

/* ---------- posts area ---------- */

#posts {
    max-width: 700px;
    margin: 0 auto;
    padding: 74px 20px 40px 20px;
}

.post {
    background: #c0c0c0;
    border: 2px outset #fff;
    margin-bottom: 24px;
}

.post-body-wrap {
    background: #c0c0c0;
    padding: 12px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 2px inset #808080;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 12px;
}

.account {
    background: none;
    color: #000;
    font-weight: bold;
    text-decoration: none;
    font-size: 13px;
}

.account:hover {
    text-decoration: underline;
}

.time {
    color: #000;
}

.post-number {
    font-size: 10px;
    font-weight: normal;
    color: #999;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #000;
}

.body {
    background: #fff;
    border: 2px inset #808080;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    white-space: pre-wrap;
}

.tags {
    margin-top: 4px;
}

.tag {
    display: inline-block;
    background: #c0c0c0;
    border: 2px outset #fff;
    color: #000;
    padding: 4px 10px;
    margin: 3px 4px 3px 0;
    font-size: 12px;
}

.post-actions {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.reply-btn {
    padding: 5px 12px;
    font-size: 12px;
}

.replies-dropdown {
    margin-top: 10px;
}

.replies-summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 5px 10px;
    display: inline-block;
    list-style: none;
}

.replies-summary::-webkit-details-marker {
    display: none;
}

.replies-list {
    margin-top: 8px;
    padding-left: 4px;
}

.reply {
    background: #c0c0c0;
    border: 1px outset #fff;
    margin-bottom: 5px;
}

.reply-body-wrap {
    padding: 5px;
}

.reply-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px inset #808080;
    padding: 2px 5px;
    margin-bottom: 4px;
    font-size: 10px;
}

.reply-account {
    font-weight: bold;
    color: #000;
}

.reply-time {
    color: #666;
}

.reply-number {
    font-size: 9px;
    color: #aaa;
}

.reply-body {
    font-size: 11px;
    line-height: 1.4;
    white-space: pre-wrap;
}

.nested-actions {
    margin-top: 6px;
}

.tiny-btn {
    padding: 3px 8px;
    font-size: 10px;
}

.nested-dropdown {
    margin-top: 6px;
}

.nested-summary {
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 3px 8px;
    display: inline-block;
    list-style: none;
}

.nested-summary::-webkit-details-marker {
    display: none;
}

.nested-list {
    margin-top: 6px;
    padding-left: 6px;
}

.nested-reply {
    background: #e8e8e8;
    border: 1px solid #999;
    margin-bottom: 6px;
    padding: 6px;
}

.nested-reply-header {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    margin-bottom: 3px;
    color: #333;
}

.nested-reply-account {
    font-weight: bold;
}

.nested-reply-body {
    font-size: 10px;
    line-height: 1.3;
    white-space: pre-wrap;
}

.no-replies-tiny {
    font-size: 10px;
    color: #888;
}

.no-replies {
    font-size: 11px;
    color: #666;
    padding: 4px;
}

</style>

</head>


<body>

<div class="taskbar">
    <a id="submit" class="win95-btn" href="https://forms.gle/CMp8R9QD4FQjnYh3A">
        Submit a post
    </a>

    <a id="account" class="win95-btn" href="https://forms.gle/vFY3431M2UkGoQky5">
        Make an account
    </a>
</div>

<div id="posts"></div>


<script>

function accountUrl(name) {
    return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-");
}

// Renders a reply and all of its own replies, recursively — works at any
// nesting depth, since the same "Reply" form and dropdown pattern applies
// whether you're replying to a post's reply or to another reply.
function renderReply(reply) {

    const children = reply.replies || [];

    return `
        <div class="reply">
            <div class="reply-body-wrap">
                <div class="reply-header">
                    <span class="reply-account">${reply.name}</span>
                    <span style="display:flex; align-items:center; gap:6px;">
                        <span class="reply-time">${new Date(reply.timestamp).toLocaleString()}</span>
                        <span class="reply-number">#${reply.id}</span>
                    </span>
                </div>
                <div class="reply-body">${reply.body}</div>

                <div class="nested-actions">
                    <a class="win95-btn tiny-btn" href="https://forms.gle/unba1gXEDGBEx6YA8" target="_blank" rel="noopener">
                        Reply
                    </a>
                </div>

                <details class="nested-dropdown">
                    <summary class="nested-summary">Replies (${children.length})</summary>
                    <div class="nested-list">
                        ${
                            children.length === 0
                                ? `<div class="no-replies-tiny">No replies yet.</div>`
                                : children.map(renderReply).join("")
                        }
                    </div>
                </details>
            </div>
        </div>
    `;
}
const url = "https://script.google.com/macros/s/AKfycbwVuMo1rn69RfXOzZ6xUvhDqQzy3RNLoyPq-3yrPfx4oANAOF2Ntkb0cmn7YHoiES8fEg/exec";


fetch(url)

.then(response => response.json())

.then(posts => {

    const container =
        document.getElementById("posts");

    if (!Array.isArray(posts)) {
        container.innerHTML =
            `<div class="post"><div class="post-body-wrap">Failed to load posts: ${posts.error || "unknown error"}</div></div>`;
        return;
    }

    posts.reverse();


    posts.forEach(post => {


        const tags = post.tags

            .split(",")

            .map(tag =>
                `<span class="tag">
                    ${tag.trim()}
                 </span>`
            )

            .join("");



        container.innerHTML += `


        <div class="post">

            <div class="post-body-wrap">

                <div class="header">

                    <a
                        class="account"
                        href="https://moonlightoctopus.github.io/Get/accounts/${accountUrl(post.name)}.html"
                    >
                        ${post.name}
                    </a>

                    <div style="display:flex; align-items:center; gap:10px;">
                        <div class="time">
                            ${new Date(post.timestamp).toLocaleString()}
                        </div>

                        <div class="post-number">#${post.number}</div>
                    </div>

                </div>

                <div class="title">${post.title}</div>

                <div class="body">${
                    post.body.trim()
                }</div>

                <div class="tags">
                    ${tags}
                </div>

                <div class="post-actions">
                    <a class="win95-btn reply-btn" href="https://forms.gle/NsCWdpkaFn56UM7K6" target="_blank" rel="noopener">
                        Reply
                    </a>
                </div>

                <details class="replies-dropdown">
                    <summary class="replies-summary">Replies (${(post.replies || []).length})</summary>
                    <div class="replies-list">
                        ${
                            !post.replies || post.replies.length === 0
                                ? `<div class="no-replies">No replies yet.</div>`
                                : post.replies.map(renderReply).join("")
                        }
                    </div>
                </details>

            </div>

        </div>


        `;


    });


});


</script>


</body>

</html>
