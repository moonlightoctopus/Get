<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Get - Bulletin Board</title>

<style>

@font-face {
    font-family: 'Win95';
    src: local('MS Sans Serif'), local('Tahoma');
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'MS Sans Serif', 'Tahoma', Geneva, sans-serif;
    font-size: 13px;
    background: #999999;
    margin: 0;
    padding: 0;
    color: #000;
}

/* ---------- top taskbar ---------- */

.taskbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    background: #c0c0c0;
    border-bottom: 2px solid #000;
    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    z-index: 1000;
}

.search-bar {
    position: fixed;
    top: 54px;
    left: 0;
    right: 0;
    height: 40px;
    background: #c0c0c0;
    border-bottom: 2px solid #000;
    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    display: flex;
    align-items: center;
    padding: 0 10px;
    z-index: 999;
}

.search-group {
    display: flex;
    align-items: center;
    gap: 6px;
}

.search-input {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 6px;
    border: 2px inset #808080;
    background: #fff;
    color: #000;
    width: 160px;
}

.search-btn {
    padding: 5px 10px;
    font-size: 12px;
}

.win95-btn {
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
}

.win95-btn:active {
    border-style: inset;
    padding: 9px 15px 7px 17px;
}

.taskbar-group {
    display: flex;
    align-items: center;
    gap: 10px;
}

.site-title {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #fff;
    pointer-events: none;
    white-space: nowrap;
}

/* ---------- posts area ---------- */

#posts {
    max-width: 700px;
    margin: 0 auto;
    padding: 104px 20px 40px 20px;
}

.post {
    background: #c0c0c0;
    border: 2px outset #fff;
    margin-bottom: 24px;
}

.post-body-wrap {
    background: #c0c0c0;
    padding: 12px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 2px inset #808080;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 12px;
}

.account {
    background: none;
    color: #000;
    font-weight: bold;
    text-decoration: none;
    font-size: 13px;
}

.account:hover {
    text-decoration: underline;
}

.time {
    color: #000;
}

.post-number {
    font-size: 10px;
    font-weight: normal;
    color: #999;
}

.pinned-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #000;
}

.body {
    background: #fff;
    border: 2px inset #808080;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    white-space: pre-wrap;
}

.tags {
    margin-top: 4px;
}

.tag {
    display: inline-block;
    background: #c0c0c0;
    border: 2px outset #fff;
    color: #000;
    padding: 4px 10px;
    margin: 3px 4px 3px 0;
    font-size: 12px;
}

.post-actions {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.reply-btn {
    padding: 5px 12px;
    font-size: 12px;
}

.replies-dropdown {
    margin-top: 10px;
}

.replies-summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 5px 10px;
    display: inline-block;
    list-style: none;
}

.replies-summary::-webkit-details-marker {
    display: none;
}

.replies-list {
    margin-top: 8px;
    padding-left: 4px;
}

.reply {
    background: #c0c0c0;
    border: 2px outset #fff;
    margin-bottom: 8px;
}

.reply-body-wrap {
    padding: 8px;
}

.reply-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 2px inset #808080;
    padding: 4px 8px;
    margin-bottom: 6px;
    font-size: 10px;
}

.reply-account {
    font-weight: bold;
    color: #000;
}

.reply-account-link {
    color: #000;
    text-decoration: none;
}

.reply-account-link:hover {
    text-decoration: underline;
}

.reply-time {
    color: #666;
}

.reply-number {
    font-size: 9px;
    color: #aaa;
}

.reply-body {
    font-size: 11px;
    line-height: 1.4;
    white-space: pre-wrap;
}

.nested-actions {
    margin-top: 6px;
}

.tiny-btn {
    padding: 3px 8px;
    font-size: 10px;
}

.nested-dropdown {
    margin-top: 6px;
}

.nested-summary {
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 3px 8px;
    display: inline-block;
    list-style: none;
}

.nested-summary::-webkit-details-marker {
    display: none;
}

.nested-list {
    margin-top: 6px;
    padding-left: 6px;
}

.nested-reply {
    background: #e8e8e8;
    border: 1px solid #999;
    margin-bottom: 6px;
    padding: 6px;
}

.nested-reply-header {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    margin-bottom: 3px;
    color: #333;
}

.nested-reply-account {
    font-weight: bold;
}

.nested-reply-body {
    font-size: 10px;
    line-height: 1.3;
    white-space: pre-wrap;
}

.no-replies-tiny {
    font-size: 10px;
    color: #888;
}

.no-replies {
    font-size: 11px;
    color: #666;
    padding: 4px;
}

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 14px 0;
}

.pagination .win95-btn {
    padding: 6px 14px;
    font-size: 12px;
}

.pagination .win95-btn.disabled {
    color: #808080;
    text-shadow: 1px 1px 0 #fff;
    pointer-events: none;
    cursor: default;
}

.page-indicator {
    font-size: 12px;
    font-weight: bold;
}

#report {
    color: rgb(88, 18, 18);
}

</style>

</head>


<body>

<div class="taskbar">
    <div class="taskbar-group">
        <a id="submit" class="win95-btn" href="https://forms.gle/CMp8R9QD4FQjnYh3A" target="_blank" rel="noopener">
            Submit a post
        </a>

        <a id="account" class="win95-btn" href="https://forms.gle/vFY3431M2UkGoQky5" target="_blank" rel="noopener">
            Make an account
        </a>

        <a id="account" class="win95-btn" href="https://forms.gle/EMxoFf2P8ttZChFr6" target="_blank" rel="noopener">
            Request Profile Changes
        </a>

        <a id="report" class="win95-btn" href="https://forms.gle/3mCvFGJ4ruWjZ2kD7" target="_blank" rel="noopener">
            Report
        </a>
    </div>

    <div class="taskbar-group">
        <a id="profiles" class="win95-btn" href="https://moonlightoctopus.github.io/Get/other/view-profiles.html" target="_blank" rel="noopener">
            View Profiles
        </a>

        <a id="rules" class="win95-btn" href="https://moonlightoctopus.github.io/Get/other/rules.html" target="_blank" rel="noopener">
            Rules
        </a>

        <a id="mods" class="win95-btn" href="https://moonlightoctopus.github.io/Get/other/mods.html" target="_blank" rel="noopener">
            View Mods
        </a>
        
        <a id="feedback" class="win95-btn" href="https://forms.gle/PSH3yVqZdnvzEK2u5" target="_blank" rel="noopener">
            Submit Feedback & Ideas
        </a>

        <a id="dev" class="win95-btn" href="https://moonlightoctopus.github.io/Get/other/devlog.html" target="_blank" rel="noopener">
            Devlog
        </a>
    </div>

    <div class="site-title">The Site</div>
</div>

<div class="search-bar">
    <div class="search-group">
        <input id="titleSearch" class="search-input" type="text" placeholder="Search titles...">
        <input id="tagSearch" class="search-input" type="text" placeholder="Search tags...">
        <button id="tagSearchBtn" class="win95-btn search-btn">Search</button>
        <button id="tagSearchClear" class="win95-btn search-btn">Clear</button>
    </div>
</div>

<div id="posts">Loading posts...</div>


<script>

function accountUrl(name) {
    return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-");
}

function accountLink(name, className) {
    return `<a class="${className}" href="https://moonlightoctopus.github.io/Get/accounts/${accountUrl(name)}.html" target="_blank" rel="noopener">${name}</a>`;
}

// Renders a reply and all of its own replies, recursively — works at any
// nesting depth, since the same "Reply" form and dropdown pattern applies
// whether you're replying to a post's reply or to another reply.
function renderReply(reply) {

    const children = reply.replies || [];

    return `
        <div class="reply">
            <div class="reply-body-wrap">
                <div class="reply-header">
                    <span class="reply-account">${accountLink(reply.name, "reply-account-link")}</span>
                    <span style="display:flex; align-items:center; gap:6px;">
                        <span class="reply-time">${new Date(reply.timestamp).toLocaleString()}</span>
                        <span class="reply-number">#${reply.id}</span>
                    </span>
                </div>
                <div class="reply-body">${reply.body}</div>

                <div class="nested-actions">
                    <a class="win95-btn tiny-btn" href="https://forms.gle/unba1gXEDGBEx6YA8" target="_blank" rel="noopener">
                        Reply
                    </a>
                </div>

                <details class="nested-dropdown">
                    <summary class="nested-summary">Replies (${children.length})</summary>
                    <div class="nested-list">
                        ${
                            children.length === 0
                                ? `<div class="no-replies-tiny">No replies yet.</div>`
                                : children.map(renderReply).join("")
                        }
                    </div>
                </details>
            </div>
        </div>
    `;
}
const POSTS_PER_PAGE = 10;

function renderPagination(page, totalPages) {

    if (totalPages <= 1) return "";

    const prevDisabled = page <= 1;
    const nextDisabled = page >= totalPages;

    return `
        <div class="pagination">
            <a class="win95-btn ${prevDisabled ? "disabled" : ""}" href="#" data-page="${page - 1}">&laquo; Prev</a>
            <span class="page-indicator">Page ${page} of ${totalPages}</span>
            <a class="win95-btn ${nextDisabled ? "disabled" : ""}" href="#" data-page="${page + 1}">Next &raquo;</a>
        </div>
    `;
}

const url = "https://script.google.com/macros/s/AKfycbxlJ0S3fG8eNdCMx6W7JyfSivyD7GuU1yBp420hK45v_XzAJ-zfilB9C2aOoF06nyKzXw/exec";

let allPosts = [];
let currentSearch = "";
let currentTitleSearch = "";

// Returns the tags on a post as a clean, lowercase array for matching.
function postTags(post) {
    return (post.tags || "")
        .split(",")
        .map(t => t.trim().toLowerCase())
        .filter(Boolean);
}

// Posts whose tags include (as a substring) the current tag search query,
// AND whose title includes (as a substring) the current title search query.
// Either filter is skipped if its query is empty.
function getFilteredPosts() {

    const tagQ = currentSearch.trim().toLowerCase();
    const titleQ = currentTitleSearch.trim().toLowerCase();

    return allPosts.filter(post => {
        const matchesTag = !tagQ || postTags(post).some(tag => tag.includes(tagQ));
        const matchesTitle = !titleQ || (post.title || "").toLowerCase().includes(titleQ);
        return matchesTag && matchesTitle;
    });
}

function renderPosts(page) {

    const container = document.getElementById("posts");

    const posts = getFilteredPosts();

    const totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));

    if (!Number.isInteger(page) || page < 1) page = 1;
    if (page > totalPages) page = totalPages;

    if (posts.length === 0) {
        const parts = [];
        if (currentTitleSearch.trim()) parts.push(`title "${currentTitleSearch}"`);
        if (currentSearch.trim()) parts.push(`tag "${currentSearch}"`);
        const desc = parts.length ? parts.join(" and ") : "your search";
        container.innerHTML =
            `<div class="post"><div class="post-body-wrap">No posts match ${desc}.</div></div>`;
        return;
    }

    const startIdx = (page - 1) * POSTS_PER_PAGE;
    const pagePosts = posts.slice(startIdx, startIdx + POSTS_PER_PAGE);

    const postsHtml = pagePosts.map(post => {

        const tags = post.tags

            .split(",")

            .map(tag =>
                `<span class="tag">
                    ${tag.trim()}
                 </span>`
            )

            .join("");



        return `


        <div class="post">

            <div class="post-body-wrap">

                ${
                    post.pinned
                        ? `<div class="pinned-label">Pinned by ${post.pinnedByName}</div>`
                        : ""
                }

                <div class="header">

                    <a
                        class="account"
                        href="https://moonlightoctopus.github.io/Get/accounts/${accountUrl(post.name)}.html"
                        target="_blank" rel="noopener"
                    >
                        ${post.name}
                    </a>

                    <div style="display:flex; align-items:center; gap:10px;">
                        <div class="time">
                            ${new Date(post.timestamp).toLocaleString()}
                        </div>

                        <div class="post-number">#${post.number}</div>
                    </div>

                </div>

                <div class="title">${post.title}</div>

                <div class="body">${
                    post.body.trim()
                }</div>

                <div class="tags">
                    ${tags}
                </div>

                <div class="post-actions">
                    <a class="win95-btn reply-btn" href="https://forms.gle/NsCWdpkaFn56UM7K6" target="_blank" rel="noopener">
                        Reply
                    </a>
                </div>

                <details class="replies-dropdown">
                    <summary class="replies-summary">Replies (${(post.replies || []).length})</summary>
                    <div class="replies-list">
                        ${
                            !post.replies || post.replies.length === 0
                                ? `<div class="no-replies">No replies yet.</div>`
                                : post.replies.map(renderReply).join("")
                        }
                    </div>
                </details>

            </div>

        </div>


        `;

    });

    const paginationHtml = renderPagination(page, totalPages);

    container.innerHTML = paginationHtml + postsHtml.join("") + paginationHtml;
}

const container = document.getElementById("posts");

fetch(url)

.then(response => response.json())

.then(posts => {

    if (!Array.isArray(posts)) {
        container.innerHTML =
            `<div class="post"><div class="post-body-wrap">Failed to load posts: ${posts.error || "unknown error"}</div></div>`;
        return;
    }

    posts.reverse();

    // Pinned posts float to the top; order is otherwise unchanged (Array.sort
    // is stable, so newest-first order is preserved within each group).
    posts.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

    allPosts = posts;

    const params = new URLSearchParams(window.location.search);
    let page = parseInt(params.get("page"), 10);
    if (!Number.isInteger(page) || page < 1) page = 1;

    renderPosts(page);
})

.catch(err => {
    container.innerHTML =
        `<div class="post"><div class="post-body-wrap">Failed to load posts: ${err}</div></div>`;
});

// Pagination clicks (event delegation, since posts are re-rendered often).
container.addEventListener("click", event => {
    const link = event.target.closest("a[data-page]");
    if (!link || link.classList.contains("disabled")) return;
    event.preventDefault();
    renderPosts(parseInt(link.dataset.page, 10));
    window.scrollTo({ top: 0, behavior: "instant" });
});

// Tag & title search wiring.
const searchInput = document.getElementById("tagSearch");
const titleSearchInput = document.getElementById("titleSearch");
const searchBtn = document.getElementById("tagSearchBtn");
const clearBtn = document.getElementById("tagSearchClear");

function runSearch() {
    currentSearch = searchInput.value;
    currentTitleSearch = titleSearchInput.value;
    renderPosts(1);
}

searchBtn.addEventListener("click", runSearch);

searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") runSearch();
});

titleSearchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") runSearch();
});

clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    titleSearchInput.value = "";
    currentSearch = "";
    currentTitleSearch = "";
    renderPosts(1);
});

</script>


</body>

</html>
