<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'MS Sans Serif', 'Tahoma', Geneva, sans-serif;
    font-size: 13px;
    background-color: #c0c0c0;
    background-image:
        linear-gradient(rgba(192, 192, 192, 0.9), rgba(192, 192, 192, 0.9)),
        url('../assets/fish.png');
    background-size: auto, 32px 32px;
    background-repeat: no-repeat, repeat;
    image-rendering: pixelated;
    margin: 0;
    padding: 40px;
    color: #000;
    position: relative;
    min-height: 100vh;
}

.window {
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: auto;
    background: #c0c0c0;
    border: 2px outset #fff;
}

.profile {
    position: relative;
    padding: 20px;
    text-align: center;
}

.username {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 16px;
    color: #000;
}

.account-index {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 12px;
    font-weight: bold;
    color: #999;
}

.bio-label {
    text-align: left;
    font-weight: bold;
    margin-bottom: 4px;
}

.bio {
    background: #fff;
    border: 2px inset #808080;
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    text-align: left;
    min-height: 80px;
}

.win95-btn {
    background: #c0c0c0;
    border: 2px outset #fff;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    margin-top: 16px;
}

.win95-btn:active {
    border-style: inset;
    padding: 9px 15px 7px 17px;
}

.signin-area {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 2px solid #808080;
    box-shadow: inset 0 1px 0 #fff;
    text-align: left;
}

.password-label {
    font-weight: bold;
    margin-bottom: 4px;
    display: block;
}

.password-row {
    display: flex;
    gap: 6px;
}

.win95-input {
    flex: 1;
    background: #fff;
    border: 2px inset #808080;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
}

.inbox {
    text-align: left;
    margin-top: 16px;
}

.inbox-label {
    font-weight: bold;
    margin-bottom: 8px;
}

.dm {
    background: #fff;
    border: 1px inset #808080;
    padding: 5px 7px;
    margin-bottom: 5px;
    font-size: 11px;
    white-space: pre-wrap;
}

.dm-meta {
    font-weight: bold;
    margin-bottom: 4px;
    color: #000;
}

.account-link {
    color: #000;
    text-decoration: none;
    font-weight: bold;
}

.account-link:hover {
    text-decoration: underline;
}

.dm-time {
    font-weight: normal;
    color: #444;
    font-size: 11px;
}

.inbox-status {
    font-size: 12px;
    color: #444;
    margin-top: 10px;
}

.newest {
    text-align: left;
    margin-top: 16px;
}

.newest-label {
    font-weight: bold;
    margin-bottom: 8px;
}

.newest-item {
    background: #fff;
    border: 1px inset #808080;
    padding: 3px 5px;
    margin-bottom: 3px;
    font-size: 9px;
    white-space: pre-wrap;
}

.newest-meta {
    font-weight: bold;
    margin-bottom: 1px;
    color: #000;
    font-size: 10px;
}

.newest-target {
    font-weight: normal;
    color: #444;
    font-size: 9px;
    margin-bottom: 2px;
}

.newest-time {
    font-weight: normal;
    color: #444;
    font-size: 9px;
}

.statusbar {
    border-top: 2px solid #808080;
    box-shadow: inset 0 1px 0 #fff;
    padding: 4px 10px;
    font-size: 11px;
    color: #000;
}

.error-state {
    color: #900;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="app"></div>

<script src="../assets/profile.js"></script>

</body>
</html>
